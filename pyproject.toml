[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-harness"
version = "0.3.0"
description = "Evidence-bound robot self-improvement: benchmark-first curricula, memory, skills, and inspectable tool execution."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Embodied Harness contributors"}]
dependencies = ["jsonschema>=4.21,<5"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
sim = ["numpy>=1.22,<2", "Pillow>=10"]
metaworld = ["metaworld>=3,<4", "numpy>=1.24,<2", "Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.8", "build>=1"]

[project.scripts]
embodied-harness = "embodied_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embodied_harness = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
